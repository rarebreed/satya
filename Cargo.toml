[workspace]
resolver = "2"
members = [
    "crates/satya-schema",
    "crates/satya-storage",
    "crates/satya-signaling",
    "crates/satya-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sean Toner <placeoftheway@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
apache-avro = { version = "0.17", features = ["snappy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "v7", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
bytes = "1.9"
futures = "0.3"
async-trait = "0.1"
argon2 = "0.5"
rand = "0.8"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
leptos = { version = "0.7", features = ["csr", "ssr"] }
object_store = { version = "0.11", features = ["aws"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
hex = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioContext",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlSelectElement",
    "HtmlVideoElement",
    "KeyboardEvent",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MessageEvent",
    "Navigator",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcRtpSender",
    "RtcSdpType",
    "RtcSessionDescriptionInit",
    "RtcTrackEvent",
    "WebSocket",
    "Window",
] }
