[project]
name = "satya"
version = "0.1.0"
description = "Add a short description here"
authors = ["Sean Toner <placeoftheway@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tasks]

[dependencies]
python = ">=3.12"
polars = ">=1.6.0,<2"
pyarrow = ">=17.0.0,<18"
pydantic = ">=2.8.2,<3"
fastapi = ">=0.112.2,<0.113"
hypercorn = ">=0.17.3,<0.18"
trio = ">=0.26.2,<0.27"

[pypi-dependencies]
getdaft = ">=0.3.1, <0.4"

[environments]
dev = ["dev"]

[feature.dev.dependencies]
ruff = ">=0.6.2,<0.7"
autopep8 = ">=2.3.1,<3"
pytest = ">=8.3.2,<9"
pytest-asyncio = ">=0.24.0,<0.25"

[feature.dev.pypi-dependencies]
mypy = { version = ">=1.11.2, <2", extras = ["mypyc"] }

[feature.dev.tasks]
fmt = "autopep8 -i -r ."
lint = "ruff check --fix ."
test = "pytest tests"
check = {depends-on = ["fmt", "lint", "test"]}
git-add = "git add ."
commit = {cmd = "git commit -m ", depends-on = ["git-add"]}
push = "git push origin "
