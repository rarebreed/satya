[workspace]
authors = ["Sean Toner <placeoftheway@gmail.com>"]
channels = ["conda-forge"]
name = "satya"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
python = ">=3.14.7,<3.15"
rust = ">=1.99.1"
rust-std-wasm32-unknown-unknown = ">=1.99.1"
wasm-pack = ">=0.13"

[pypi-dependencies]
pylance = ">=12.0.0, <13"
fastavro = ">=1.9.0"
pyarrow = ">=18.0.0"
pytest = ">=9.0.0"
langgraph = ">=0.4.0"
langchain-core = ">=0.3.0"
langchain-ollama = ">=0.3.0"
langchain-google-genai = ">=2.1.0"
langchain-openai = ">=0.3.0"
langchain-anthropic = ">=0.3.0"
langchain-mcp-adapters = ">=0.1.0"
fastapi = ">=0.115.0"
uvicorn = ">=0.34.0"
httpx = ">=0.28.0"
plotly = ">=6.0.0"
marimo = ">=0.11.0"
pyrefly = ">=0.15.0"

[tasks]
# --- Build & Quality ---
check = { cmd = "cargo check --workspace", description = "Type-check all Rust crates in the workspace" }
check-wasm = { cmd = "cargo clippy -p satya-web --target wasm32-unknown-unknown -- -D warnings", description = "Type-check + lint satya-web wasm32-only code (cfg(target_arch = \"wasm32\")) skipped by host builds" }
fmt = { cmd = "cargo fmt --all", description = "Format all Rust code in the workspace" }
lint = { cmd = "cargo clippy --workspace --all-targets", description = "Run Clippy lints across all Rust crates" }
prep = { depends-on = ["fmt", "lint", "check-wasm"] }
prepc = { cmd = "git commit -m ",  depends-on = ["check", "check-wasm", "fmt", "lint"] }
build = { cmd = "cargo build --workspace", description = "Build debug binaries for the workspace" }
build-release = { cmd = "cargo build --workspace --release", description = "Build optimized release binaries" }
build-py = { cmd = "cargo build -p satya-py --release && cp target/release/satya_py.dll src/satya_py.pyd", description = "Compile the satya-py PyO3 Rust extension and install satya_py.pyd into src/" }
build-wasm = { cmd = "wasm-pack build crates/satya-web --target web --no-opt --out-dir ../../pkg", description = "Compile satya-web Rust/Leptos frontend to WebAssembly in pkg/" }

# --- Granular & Unified Test Suites ---
test-schema = { cmd = "cargo test -p satya-schema", description = "Run Avro schema, CRC-64 fingerprint, and v1->v2 evolution tests" }
test-storage = { cmd = "cargo test -p satya-storage", description = "Run Apache Iggy & offset-tracked Avro micro-batching tests" }
test-signaling = { cmd = "cargo test -p satya-signaling", description = "Run Argon2 auth, session password, disconnect, and private routing tests" }
test-web = { cmd = "cargo test -p satya-web", depends-on = ["check-wasm"], description = "Run Leptos SSR and Rust/Wasm client unit tests (after wasm32 compile gate)" }
test-rust = { cmd = "cargo test --workspace", description = "Run all Rust unit, integration, and doc tests" }
test-py = { cmd = "pytest tests", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Run Python Avro & PyLance ML pipeline unit tests" }
test = { depends-on = ["check-wasm", "test-rust", "test-py"], description = "Run the full polyglot (Rust + Python) test suite, gated on the satya-web wasm32 compile check" }

# --- Server & Runtime ---
serve = { cmd = "cargo run -p satya-signaling --bin satya-server", depends-on = ["build-wasm"], env = { RUST_LOG = "info,satya_signaling=debug,satya_storage=debug" }, description = "Build Wasm frontend and start the Satya WebRTC, Chat & Apache Iggy Event Server on port 3000" }
serve-release = { cmd = "cargo run --release -p satya-signaling --bin satya-server", depends-on = ["build-wasm"], env = { RUST_LOG = "info" }, description = "Build Wasm frontend and start the optimized release server on port 3000" }
serve-ai-gm = { cmd = "python -m satya_ml.ai_gm.server", env = { PYTHONPATH = "src" }, description = "Start the Satya AI GM LangGraph + FastAPI service on 127.0.0.1:8090" }
serve-ai-gm-debug = { cmd = "python -m satya_ml.ai_gm.server --debug", env = { PYTHONPATH = "src", SATYA_AI_GM_LOG_LEVEL = "DEBUG" }, description = "Start the Satya AI GM LangGraph + FastAPI service on 127.0.0.1:8090 with verbose DEBUG logging" }
serve-ai-player = { cmd = "python -m satya_ml.ai_player.server", env = { PYTHONPATH = "src" }, description = "Start the standalone Satya AI Player LangGraph + FastAPI service on 127.0.0.1:8091" }

# --- Avro, Apache Iggy & PyLance Data Pipeline ---
compact-to-lance = { cmd = "python -m satya_ml.lance_ingest", env = { PYTHONPATH = "src" }, description = "Compact flushed .avro topic batches into .lance AI datasets" }
inspect-schemas = { cmd = "python -m satya_ml.inspect_avro --schemas", env = { PYTHONPATH = "src" }, description = "Validate and display all versioned .avsc schemas in schemas/" }
inspect-topics = { cmd = "python -m satya_ml.inspect_avro --topics", env = { PYTHONPATH = "src" }, description = "Inspect flushed .avro batch watermarks and .lance table row counts" }
ml-pipeline = { depends-on = ["compact-to-lance", "inspect-topics"], description = "Run incremental Avro-to-PyLance compaction and print dataset summary" }

# --- Notebooks and pyo3 ---
notebook = { cmd = "marimo edit notebooks/dice_probability_distributions.py", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Launch interactive Marimo notebook editor for Satya TTRPG Dice Probability Distributions" }
notebook-app = { cmd = "marimo run notebooks/dice_probability_distributions.py", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Launch the Satya TTRPG Dice Probability Distributions Marimo dashboard app" }
rules-book = { cmd = "marimo edit notebooks/satya_rules_book.py", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Launch interactive Marimo Rules Book notebook (`docs/ttrpg/` + 2d20 & Tactical Pool cells)" }
rules-book-app = { cmd = "marimo run notebooks/satya_rules_book.py", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Launch the Satya TTRPG Rules Book Marimo web app" }
notebook-rules = { cmd = "marimo edit notebooks/satya_rules_book.py", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Alias for rules-book: launch interactive Marimo Rules Book notebook" }
notebook-rules-app = { cmd = "marimo run notebooks/satya_rules_book.py", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Alias for rules-book-app: launch the Satya TTRPG Rules Book Marimo web app" }
build-book = { cmd = "python -m satya_ml.build_rules_book", depends-on = ["build-py"], env = { PYTHONPATH = "src" }, description = "Generate static HTML Rules Book pages and catalog.json into docs/book/" }
check-py-ext = { cmd = "cargo check -p satya-py", description = "Type-check the satya-py PyO3 Python extension crate" }
