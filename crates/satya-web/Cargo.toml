[package]
name = "satya-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Disable Binaryen's redundant `wasm-opt` post-pass: its Precompute pass crashes
# (exit 0xc0000409 at Precompute.cpp:838) on Rust 1.99+ LLVM-optimized Wasm output.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
satya-schema = { path = "../satya-schema" }
satya-engine = { path = "../satya-engine" }
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
bytemuck.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu.workspace = true

[dev-dependencies]
naga = { version = "24.0", default-features = false, features = ["wgsl-in"] }
