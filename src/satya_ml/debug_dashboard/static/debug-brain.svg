<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Satya AI Debugger — Side-Profile Brain &amp; Atomic Orbits</title>
  <defs>
    <!-- Exact major-axis endpoints for rotated ellipses centered at (32, 32) -->
    <path id="orbit-cyan" d="M 55.32 17.43 A 27.5 10.2 -32 1 1 8.68 46.57 A 27.5 10.2 -32 1 1 55.32 17.43 Z"/>
    <path id="orbit-gold" d="M 8.68 17.43 A 27.5 10.2 32 1 1 55.32 46.57 A 27.5 10.2 32 1 1 8.68 17.43 Z"/>
    <path id="orbit-violet" d="M 32 4.5 A 10 27.5 0 1 1 32 59.5 A 10 27.5 0 1 1 32 4.5 Z"/>

    <linearGradient id="brain-cortex" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="48%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="brain-cerebellum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Back rings of the 3 atomic electron orbits (behind the brain) -->
  <use href="#orbit-cyan" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.55"/>
  <use href="#orbit-gold" fill="none" stroke="#f5b636" stroke-width="2" stroke-opacity="0.55"/>
  <use href="#orbit-violet" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Brainstem descending below cerebellum & temporal lobe -->
  <path d="M 33.5 39 C 33.5 43.5 34.5 47.5 36.2 50.5 L 40.8 49.5 C 39.6 46.5 39 43 39 39 Z"
        fill="url(#brain-cerebellum)" stroke="#0b1224" stroke-width="2" stroke-linejoin="round"/>

  <!-- Cerebellum (tucked snugly under the occipital lobe) -->
  <path d="M 36.5 36.2 C 36.8 32.8 41.5 31.2 45.8 33.2 C 48.8 34.6 49 38.8 46.5 41.5 C 43.8 44 37.5 42.8 36.5 36.2 Z"
        fill="url(#brain-cerebellum)" stroke="#0b1224" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 38.6 36.5 Q 42.8 35.6 46.6 36.8 M 38.6 39.2 Q 42.6 38.5 46 39.8"
        fill="none" stroke="#3b0764" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Main Cerebral Cortex in crisp left-facing anatomical side profile -->
  <path d="M 18.5 35.5
           C 14.5 34.5 13 30 14.5 25.5
           C 15.8 20.5 20.5 16.2 26.8 15
           C 32.5 13.8 39.2 14.5 44.2 17.5
           C 48.8 20.2 51.2 25.5 50.2 30.8
           C 49.4 34.5 46.2 36.2 42 35.5
           C 39.5 35 37.5 36.2 35.2 38.2
           C 32 40.8 26.8 40.5 24 37.2
           C 22.2 36.5 20.2 36 18.5 35.5 Z"
        fill="url(#brain-cortex)" stroke="#0b1224" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Anatomical sulci (lateral Sylvian fissure + frontal, parietal & occipital gyri curves) -->
  <g fill="none" stroke="#4a044e" stroke-width="1.55" stroke-linecap="round">
    <path d="M 22.5 31.5 C 27 31 32 29.2 36.2 26.8"/>
    <path d="M 29.5 16 C 30.2 19.5 29.2 22.8 27 25"/>
    <path d="M 18.2 25.5 C 20.5 23.2 23.8 23.2 25.2 25.5"/>
    <path d="M 21.5 19.8 C 23.8 20.8 25.5 22.2 25.5 24.2"/>
    <path d="M 35 17.8 C 37.5 20 38.2 23 37 25.8"/>
    <path d="M 42.5 22.5 C 45 24 46.2 27.2 44.8 30.2"/>
    <path d="M 27.5 34.5 C 30.8 34.2 33.8 32.8 35.5 30.8"/>
  </g>

  <!-- Front bright arcs of the 3 orbits crossing cleanly over the silhouette -->
  <path d="M 55.32 17.43 A 27.5 10.2 -32 0 1 8.68 46.57"
        fill="none" stroke="#38bdf8" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M 8.68 17.43 A 27.5 10.2 32 0 1 55.32 46.57"
        fill="none" stroke="#f5b636" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M 32 4.5 A 10 27.5 0 0 1 32 59.5"
        fill="none" stroke="#818cf8" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Orbiting electrons -->
  <g>
    <circle r="3.6" fill="#38bdf8" fill-opacity="0.45">
      <animateMotion dur="3.6s" repeatCount="indefinite" begin="0s">
        <mpath href="#orbit-cyan"/>
      </animateMotion>
    </circle>
    <circle r="2.3" fill="#e0f2fe" stroke="#0b1224" stroke-width="1.1">
      <animateMotion dur="3.6s" repeatCount="indefinite" begin="0s">
        <mpath href="#orbit-cyan"/>
      </animateMotion>
    </circle>
  </g>

  <g>
    <circle r="3.6" fill="#f5b636" fill-opacity="0.45">
      <animateMotion dur="4.2s" repeatCount="indefinite" begin="-1.4s">
        <mpath href="#orbit-gold"/>
      </animateMotion>
    </circle>
    <circle r="2.3" fill="#fef3c7" stroke="#0b1224" stroke-width="1.1">
      <animateMotion dur="4.2s" repeatCount="indefinite" begin="-1.4s">
        <mpath href="#orbit-gold"/>
      </animateMotion>
    </circle>
  </g>

  <g>
    <circle r="3.6" fill="#818cf8" fill-opacity="0.45">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="-2.2s">
        <mpath href="#orbit-violet"/>
      </animateMotion>
    </circle>
    <circle r="2.3" fill="#e0e7ff" stroke="#0b1224" stroke-width="1.1">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="-2.2s">
        <mpath href="#orbit-violet"/>
      </animateMotion>
    </circle>
  </g>
</svg>
