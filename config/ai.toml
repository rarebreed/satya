# Satya AI Game Master & LLM Provider Configuration (`config/ai.toml`)
# Shared by `satya-signaling` (Rust) and `satya_ml.ai_gm` (Python FastAPI + LangGraph service).

[ai_gm]
enabled = true
service_url = "http://127.0.0.1:8090"
service_token = "satya_gm_secret_dev_token"
default_provider = "ollama"
ollama_base_url = "http://127.0.0.1:11434"
reasoning_model = "gemma4:12b"
vision_model = "gemma4:12b"
persona_id = "harsh-reality-arbiter"
temperature = 0.35
# Logging verbosity for `satya_ml.ai_gm` ("debug", "info", "warning", or "error"; overridden by `SATYA_AI_GM_LOG_LEVEL` or `--debug`).
log_level = "info"
# TCP connect timeout (milliseconds) when `satya-signaling` connects to the FastAPI AI GM service.
connect_timeout_ms = 3000
# Maximum time (seconds) to wait for an AI GM LangGraph turn to complete before timing out
# (sized to accommodate cold-start model loading and multi-step tool calling on local Ollama models).
request_timeout_secs = 180
# In end-to-end runtime (`config/ai.toml`), fail fast if the Python FastAPI AI GM service is unreachable.
# Unit and integration tests using `AiGmConfig::default()` / `StorageConfig::default()` set `fail_fast_when_offline = false` for deterministic fallback.
fail_fast_when_offline = true
