[auth]
# SQLx SQLite connection URL (relative paths are resolved against the workspace root).
database_url = "sqlite://data/auth/users.db?mode=rwc"
# Usernames automatically granted the platform-wide `ADMIN` role on startup or registration.
bootstrap_admins = ["gm_sean"]

[ai_gm]
enabled = true
service_url = "http://127.0.0.1:8090"
service_token = "satya_gm_secret_dev_token"
default_provider = "ollama"
ollama_base_url = "http://127.0.0.1:11434"
reasoning_model = "qwen2.5:14b"
vision_model = "llama3.2-vision"
persona_id = "harsh-reality-arbiter"
temperature = 0.35
# In end-to-end runtime (`config/storage.toml`), fail fast if the Python FastAPI AI GM service is unreachable.
# Unit and integration tests using `StorageConfig::default()` set `fail_fast_when_offline = false` for deterministic fallback.
fail_fast_when_offline = true

[iggy]
enabled = true
# "embedded" uses the built-in local WAL (data/iggy_streams/) + Avro batch sink without needing an external daemon.
# Set to "external" to connect to a standalone iggy-server process at `address`.
mode = "embedded"
address = "127.0.0.1:8090"
username = "iggy"
password = "iggy"
stream = "satya"
fallback_if_offline = true

[batching]
batch_max_messages = 50
batch_max_interval_ms = 5000

[topics.schema-registry]
topic_id = 1
partitions = 1
storage_backend = "local"
local_path = "data/topics/schema-registry"
s3_bucket = "satya-analytics-lake"
s3_region = "us-east-1"
s3_prefix = "raw/schema-registry"

