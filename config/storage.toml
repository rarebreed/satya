[auth]
# SQLx SQLite connection URL (relative paths are resolved against the workspace root).
database_url = "sqlite://data/auth/users.db?mode=rwc"
# Disable demo account auto-seeding in production (set `SATYA_ENABLE_DEMO_ACCOUNTS=1` for local dev).
seed_demo_accounts = false
# Usernames automatically granted the platform-wide `ADMIN` role on startup or registration.
bootstrap_admins = ["gm_sean"]
# Usernames automatically granted the `GM` role (authorized to create campaigns and sessions).
bootstrap_gms = ["host_elena"]
# Optional Google Cloud OAuth 2.0 Web Client ID & Google Picker API Key for live `drive.file` single-file selection.
# Leave empty (`""`) for offline development (uses built-in `gdoc-demo-sara` / `gsheet-demo-gear` presets & local file picker).
google_oauth_client_id = ""
google_picker_api_key = ""

[quotas]
# Per-user anti-bot resource caps & sliding-window rate limits for public GCP hosting.
max_campaigns_per_gm = 10
max_sessions_per_campaign = 25
max_total_sessions_per_gm = 50
max_pending_join_requests_per_user = 10
max_registrations_per_ip_per_hour = 10
max_creates_per_user_per_hour = 20
max_directory_searches_per_user_per_min = 30
max_join_requests_per_user_per_hour = 20
max_logins_per_ip_per_min = 30
max_logins_per_username_per_min = 10
max_session_joins_per_user_per_min = 20
max_session_resumes_per_user_per_min = 30
auth_token_ttl_hours = 168
join_token_ttl_secs = 900
join_request_ttl_hours = 72
approval_grant_ttl_hours = 24

[email]
# Outbound email notifications for offline GMs receiving a Request-to-Join.
# Keep `enabled = false` / `provider = "local_outbox"` for offline dev & tests.
# On GCP, set `enabled = true`, `provider = "resend"` (or "sendgrid", "mailgun", "webhook"),
# and inject the API key via Secret Manager into `SATYA_EMAIL_API_KEY`.
enabled = false
provider = "local_outbox"
from_address = "noreply@satya.local"
api_key_env = "SATYA_EMAIL_API_KEY"
public_app_url = "http://127.0.0.1:3000"

# Note: AI Game Master & LLM model settings live in `config/ai.toml`.

[iggy]
enabled = true
# "embedded" uses the built-in local WAL (data/iggy_streams/) + Avro batch sink without needing an external daemon.
# Set to "external" to connect to a standalone iggy-server process at `address`.
mode = "embedded"
address = "127.0.0.1:8090"
username = "iggy"
password = "iggy"
stream = "satya"
fallback_if_offline = true

[batching]
batch_max_messages = 50
batch_max_interval_ms = 5000

[topics.schema-registry]
topic_id = 1
partitions = 1
storage_backend = "local"
local_path = "data/topics/schema-registry"
s3_bucket = "satya-analytics-lake"
s3_region = "us-east-1"
s3_prefix = "raw/schema-registry"

