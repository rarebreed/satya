<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Satya Blue Lotus</title>
  <defs>
    <radialGradient id="lotus-aura" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="petal-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="petal-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="petal-crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="stamen-gold" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="31" r="28" fill="url(#lotus-aura)"/>

  <!-- Water calyx / base pad -->
  <ellipse cx="32" cy="49" rx="22" ry="5.5" fill="#124e8a" stroke="#081736" stroke-width="2.2"/>

  <!-- Outer wide petals -->
  <path d="M 32 48 C 19 49 9 41 6 29 C 16 28 26 35 32 48 Z"
        fill="url(#petal-outer)" stroke="#081736" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 32 48 C 45 49 55 41 58 29 C 48 28 38 35 32 48 Z"
        fill="url(#petal-outer)" stroke="#081736" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Mid-layer sweeping petals -->
  <path d="M 32 47 C 21 44 13 32 14 16 C 23 20 30 32 32 47 Z"
        fill="url(#petal-mid)" stroke="#081736" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 32 47 C 43 44 51 32 50 16 C 41 20 34 32 32 47 Z"
        fill="url(#petal-mid)" stroke="#081736" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Inner flanking petals -->
  <path d="M 32 46 C 23 41 20 27 23 11 C 29 18 32 31 32 46 Z"
        fill="url(#petal-inner)" stroke="#081736" stroke-width="2.1" stroke-linejoin="round"/>
  <path d="M 32 46 C 41 41 44 27 41 11 C 35 18 32 31 32 46 Z"
        fill="url(#petal-inner)" stroke="#081736" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- Center crown petal -->
  <path d="M 32 47 C 23 39 22 22 32 7 C 42 22 41 39 32 47 Z"
        fill="url(#petal-crown)" stroke="#081736" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Golden stamen core -->
  <ellipse cx="32" cy="40.5" rx="6.2" ry="4.5" fill="url(#stamen-gold)" stroke="#081736" stroke-width="1.9"/>
  <circle cx="31" cy="39.4" r="1.7" fill="#fef9c3"/>
</svg>
